name: virtual-arcade

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  lobby:
    build:
      context: .
      dockerfile: infra/docker/lobby.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GAME_ORIGIN: ${GAMES_ORIGIN:?Set GAMES_ORIGIN in .env}
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  games:
    build:
      context: .
      dockerfile: infra/docker/lobby.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GAME_ORIGIN: ${GAMES_ORIGIN:?Set GAMES_ORIGIN in .env}
    restart: unless-stopped
    ports:
      - "${GAMES_PORT:-8081}:8080"
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [frontend]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    depends_on:
      api:
        condition: service_healthy
      lobby:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:

networks:
  frontend:
  backend:
    internal: true
