<!doctype html>
<html lang="en" data-mood="luxe" data-motif="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velvet Roulette</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gameShell">
  <header class="hud">
    <span class="hud__title">Velvet Roulette</span>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <img class="chipDeco chipDeco--left" src="art/chip.svg" alt="" aria-hidden="true">
    <img class="chipDeco chipDeco--right" src="art/chip.svg" alt="" aria-hidden="true">
    <div class="wheelBox">
      <img class="wheelBackdrop" src="art/wheel-segment.svg" alt="" aria-hidden="true">
      <canvas id="wheel"></canvas>
      <i id="ball" aria-hidden="true"></i>
      <b class="pocket" id="pocket" data-color="">—</b>
    </div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="betOptions">
    <label class="field">
      <span class="field__label" data-i18n="choice">Bet type</span>
      <select id="choice">
        <option value="red" data-i18n="choiceRed">Red</option>
        <option value="black" data-i18n="choiceBlack">Black</option>
        <option value="even" data-i18n="choiceEven">Even</option>
        <option value="odd" data-i18n="choiceOdd">Odd</option>
        <option value="straight" data-i18n="choiceStraight">Straight number</option>
      </select>
    </label>
    <label class="field" id="straightWrap" hidden>
      <span class="field__label" data-i18n="straightNumber">Number</span>
      <input id="straight" type="number" min="0" max="36" value="7">
    </label>
  </div>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="bet">Bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <input id="bet" type="number" min="1" max="100000" value="100">
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="play" type="button" disabled data-i18n="spin">Spin</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
