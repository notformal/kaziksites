<!doctype html>
<html lang="en" data-mood="hot" data-motif="marble">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sic Bo</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gameShell">
  <header class="hud">
    <span class="hud__title">Sic Bo</span>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <img class="stage__bowl" src="art/bowl.svg" alt="" loading="lazy">
    <div class="dice" id="dice" data-triple="false" data-rolling="false"></div>
    <div class="stage__value" id="sum">—</div>
    <div class="diceTrack" aria-hidden="true">
      <img src="art/die-1.svg" alt="" loading="lazy">
      <img src="art/die-3.svg" alt="" loading="lazy">
      <img src="art/die-6.svg" alt="" loading="lazy">
    </div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="betPicker">
    <label class="field">
      <span class="field__label" data-i18n="betType">Bet type</span>
      <select id="betType">
        <option value="small" data-i18n="betSmall">Small (4–10)</option>
        <option value="big" data-i18n="betBig">Big (11–17)</option>
        <option value="single" data-i18n="betSingle">Single number</option>
        <option value="anytriple" data-i18n="betAnyTriple">Any triple (30:1)</option>
        <option value="triple" data-i18n="betTriple">Specific triple (180:1)</option>
      </select>
    </label>
    <label class="field" id="numWrap" hidden>
      <span class="field__label" data-i18n="number">Number</span>
      <select id="num">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="bet">Bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <input id="amt" type="number" min="1" max="100000" value="100">
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="play" type="button" disabled data-i18n="roll">Roll</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
