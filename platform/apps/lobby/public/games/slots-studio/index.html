<!doctype html>
<html lang="en" data-mood="electric" data-motif="waves">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Slots Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" class="gameShell" aria-busy="true">
  <header class="hud">
    <div class="hud__brand">
      <p class="eyebrow" data-i18n="tagline">Originals · provably fair</p>
      <h1 class="hud__title" id="title" data-i18n="loading">Loading…</h1>
    </div>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="marquee"><span id="volatility"></span><span id="bonus"></span></div>
    <div id="reels" class="reels" role="img" data-i18n-label="reelsLabel"></div>
    <div id="payline" class="payline"></div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="bet">Bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <select id="bet"></select>
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="spin" type="button" disabled data-i18n="spin">Spin</button>
    <div id="status" role="status" aria-live="polite" data-i18n="connecting">Connecting to the platform…</div>
  </div>

  <details>
    <summary data-i18n="paytable">Paytable</summary>
    <div id="paytable" class="paytable"></div>
  </details>

  <footer>
    <span id="math"></span>
    <span data-i18n="serverResult">Virtual credits only · server-decided result</span>
  </footer>
</main>
<div id="error" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
