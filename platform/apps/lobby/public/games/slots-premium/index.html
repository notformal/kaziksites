<!doctype html>
<html lang="en" data-mood="luxe" data-motif="marble">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Nova Premium Slots</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" class="gameShell" aria-busy="true">
  <header class="hud">
    <div class="hud__brand">
      <p class="eyebrow" data-i18n="tagline">Premium originals · provably fair</p>
      <h1 class="hud__title" id="title">&nbsp;</h1>
    </div>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="marquee">
      <span id="mode"></span>
      <span id="rtp"></span>
    </div>

    <div class="machine" id="machine">
      <div id="reels" class="reels" role="img" data-i18n-label="reelsLabel"></div>
      <svg class="overlay" id="overlay" aria-hidden="true" preserveAspectRatio="none"></svg>
      <div class="badge" id="cascadeBadge" hidden aria-hidden="true"></div>
      <div class="freeSpins" id="freeSpins" hidden aria-live="polite">
        <p class="freeSpins__title" id="freeSpinsTitle"></p>
        <p class="freeSpins__round" id="freeSpinsRound"></p>
        <div class="freeSpins__chips" id="freeSpinsChips"></div>
        <p class="freeSpins__total" id="freeSpinsTotal"></p>
      </div>
    </div>

    <div class="ladder" id="ladder" hidden>
      <span class="ladder__label" data-i18n="cascadeLadderLabel">Multiplier ladder</span>
      <span class="ladder__steps" id="ladderSteps"></span>
    </div>
  </section>

  <div class="hits" id="hits" aria-live="polite"></div>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="lineBet">Line bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <select id="bet"></select>
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="spin" type="button" disabled data-i18n="spin">Spin</button>
    <p class="totalBet" id="totalBet"></p>
    <div id="status" role="status" aria-live="polite" data-i18n="connecting">Connecting to the platform…</div>
  </div>

  <details>
    <summary data-i18n="paytable">Paytable</summary>
    <p class="paytable__note" data-i18n="paytableNote">Payouts are shown in line-bet units</p>
    <div id="paytable" class="paytable"></div>
  </details>

  <footer>
    <span id="engineInfo"></span>
    <span data-i18n="serverResult">Virtual credits only · server-decided result</span>
  </footer>
</main>
<div id="error" hidden></div>
<script type="module" src="game.js"></script>
</body>
</html>
