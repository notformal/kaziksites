<!doctype html>
<html lang="en" data-mood="hot" data-motif="circuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Flight — Crash</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gameShell">
  <header class="hud">
    <span class="hud__title" data-i18n="crashTitle">Neon Flight</span>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="canvas" class="crashCanvas" aria-hidden="true"></canvas>
    <img class="crashRocket" id="rocket" src="art/rocket.svg" alt="" data-visible="true">
    <img class="crashFlame" id="flame" src="art/flame.svg" alt="" data-live="false">
    <div class="stage__value crashMult" id="mult">1.00×</div>
    <div class="crashStatus" id="status" data-i18n="waitingBet">Waiting for bet</div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="bet">Bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <input id="bet" type="number" min="1" max="100000" value="100">
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="play" type="button" disabled data-i18n="launch">Launch</button>
    <button class="btn btn--danger" id="cashout" type="button" disabled data-i18n="cashout">Cash out</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
