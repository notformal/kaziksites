<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Slots Studio</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><link rel="stylesheet" href="./style.css"></head><body>
<main id="app" aria-busy="true"><header><div><p class="eyebrow">ORIGINALS · PROVABLY FAIR</p><h1 id="title">Загрузка…</h1></div><div class="wallet"><span>Баланс</span><strong id="balance">—</strong><small>CREDITS</small></div></header>
<section class="machine"><div class="marquee"><span id="volatility"></span><span id="bonus"></span></div><div id="reels" class="reels" role="img" aria-label="Игровые барабаны"></div><div id="payline" class="payline"></div></section>
<section class="controls"><label>Ставка<select id="bet"></select></label><button id="spin" disabled>КРУТИТЬ</button><div id="status" role="status" aria-live="polite">Подключение к платформе…</div></section>
<details><summary>Таблица выплат</summary><div id="paytable"></div></details><footer><span id="math"></span><span>Исход и выигрыш рассчитывает сервер</span></footer>
</main><div id="error" hidden></div><script type="module" src="./game.js"></script></body></html>
