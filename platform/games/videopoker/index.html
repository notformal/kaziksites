<!doctype html>
<html lang="en" data-mood="electric" data-motif="circuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video Poker</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gameShell">
  <header class="hud">
    <span class="hud__title" data-i18n="gameTitle">Video Poker</span>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="tableDecor" aria-hidden="true">
      <img src="art/chip.svg" alt="" loading="lazy">
      <img src="art/diamond.svg" alt="" loading="lazy">
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="controls controls--draw" id="controls">
    <button class="btn btn--primary" id="draw" type="button" hidden data-i18n="drawAction">Draw</button>
  </div>

  <div class="paytable" id="paytable" data-i18n-label="paytable"></div>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="bet">Bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <input id="bet" type="number" min="1" max="100000" value="100">
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="deal" type="button" disabled data-i18n="deal">Deal</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
