<!doctype html>
<html lang="en" data-mood="deep" data-motif="felt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casino Hold'em</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gameShell">
  <header class="hud">
    <span class="hud__title" data-i18n="gameTitle">Casino Hold'em</span>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" data-i18n-label="sound" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="table">
      <div class="hand hand--dealer">
        <div class="hand__meta">
          <span class="hand__label" data-i18n="dealer">Dealer</span>
          <b class="hand__name" id="dName"></b>
        </div>
        <div class="cards" id="dealer"></div>
      </div>
      <div class="hand hand--board">
        <div class="hand__meta">
          <span class="hand__label" data-i18n="board">Board</span>
        </div>
        <div class="cards" id="board"></div>
      </div>
      <div class="hand hand--player" id="playerHand">
        <div class="hand__meta">
          <span class="hand__label" data-i18n="player">You</span>
          <b class="hand__name" id="pName"></b>
        </div>
        <div class="cards" id="player"></div>
      </div>
    </div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="choices" id="actions" hidden>
    <button class="btn btn--primary" id="call" type="button" data-i18n="callX2">Call ×2</button>
    <button class="btn btn--danger" id="fold" type="button" data-i18n="foldMove">Fold</button>
  </div>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="ante">Ante</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <input id="bet" type="number" min="1" max="100000" value="100">
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="deal" type="button" disabled data-i18n="deal">Deal</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
