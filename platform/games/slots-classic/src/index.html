<!DOCTYPE html>
<html>
  <head>
    <title>Nova Classic Slots</title>
  </head>
  <body>
    <div id="slot">
      <header id="hud">
        <div class="hudCell">
          <small data-i18n="balance">Balance</small>
          <b id="balance">—</b>
        </div>
        <div class="hudCell">
          <small data-i18n="maxWin">Max win</small>
          <b id="maxWin">—</b>
        </div>
        <div class="hudCell hudCell--win">
          <small data-i18n="win">Win</small>
          <b id="win">0</b>
        </div>
      </header>
      <div id="reels">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="reel"></div>
      </div>
      <p id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>
      <div id="controls">
        <label class="betField">
          <span data-i18n="bet">Bet</span>
          <input id="bet" type="number" min="1" max="100000" step="10" value="100" />
        </label>
        <button type="button" id="spin" disabled data-i18n="spin">Spin</button>
        <label class="autoplayField">
          <input type="checkbox" name="autoplay" id="autoplay" />
          <span data-i18n="autoplay">Autoplay</span>
        </label>
      </div>
    </div>
  </body>
</html>
