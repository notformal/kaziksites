<!doctype html>
<html lang="en" data-mood="deep" data-motif="rays">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Limbo</title>
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="theme.generated.css">
<link rel="stylesheet" href="ui-shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="gameShell">
  <header class="hud">
    <span class="hud__title">Limbo</span>
    <div class="hud__stats">
      <div class="stat">
        <span class="stat__label" data-i18n="balance">Balance</span>
        <b class="stat__value" id="balance">—</b>
      </div>
      <div class="stat stat--win">
        <span class="stat__label" data-i18n="win">Win</span>
        <b class="stat__value" id="win">0</b>
      </div>
      <button class="btn btn--ghost" id="sound" type="button" aria-pressed="false">♪</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <img class="limboArt" src="art/rocket.svg" alt="" id="rocket">
    <div class="stage__value" id="mult">1.00×</div>
  </section>

  <p class="result" id="result" data-i18n="serverResult">Virtual credits only · server-decided result</p>

  <div class="odds">
    <label class="field">
      <span class="field__label" data-i18n="target">Target</span>
      <input id="target" type="number" min="1.01" max="1000" step="0.01" value="2">
    </label>
    <div class="field">
      <span class="field__label" data-i18n="chance">Chance</span>
      <b class="stat__value" id="chance">49.50%</b>
    </div>
    <div class="field">
      <span class="field__label" data-i18n="multiplier">Multiplier</span>
      <b class="stat__value" id="payout">2.00×</b>
    </div>
  </div>

  <div class="controls">
    <label class="field">
      <span class="field__label" data-i18n="bet">Bet</span>
      <span class="stepper">
        <button type="button" id="betDown" aria-label="-">−</button>
        <input id="bet" type="number" min="1" max="100000" value="100">
        <button type="button" id="betUp" aria-label="+">+</button>
      </span>
    </label>
    <button class="btn btn--primary" id="play" type="button" disabled data-i18n="play">Play</button>
  </div>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
