limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api_upstream { server api:8787; keepalive 32; }
upstream lobby_upstream { server lobby:8080; keepalive 16; }

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 256k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }

  location = /api/health {
    access_log off;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api_upstream/health;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api_upstream;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://lobby_upstream;
  }
}
