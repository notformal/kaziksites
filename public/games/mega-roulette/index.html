:root{--bg:#0a0e27;--purp:#a855f7;--gold:#fbbf24;--green:#10b981}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#f8fafc}
#app{display:flex;flex-direction:column;height:100vh;padding:8px;gap:6px}.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(13,13,43,.9);border-bottom:1px solid rgba(255,255,255,.06)}
.hdr h1{font-family:Poppins,sans-serif;font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--purp));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal{padding:4px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:8px;font-size:12px;font-weight:700;color:#10b981}

.game-canvas-wrap canvas{width:100%;height:100%;display:block}
.controls{display:flex;gap:8px;padding:8px 12px;background:rgba(13,13,43,.9);border-top:1px solid rgba(255,255,255,.06)}
.controls label{font-size:10px;color:#94a3b8;display:flex;align-items:center}
.controls input[type=number]{width:70px;padding:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff}
.btn{padding:10px 24px;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;text-transform:uppercase;background:linear-gradient(135deg,var(--purp),var(--green));color:#fff;transition:all .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(168,85,247,.4)}
.info-bar{display:flex;gap:12px;font-size:10px;color:#64748b;padding:4px 12px}
</style></head><body>
