<!DOCTYPE html><html lang=en><head><meta charset=UTF-8/><meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>Cosmic Queen - KazikSites</title>
<link rel=preconnect href=https://fonts.googleapis.com/><link href=https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap rel=stylesheet/>
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0e27;--panel:rgba(16,20,50,0.8);--accent:#a855f7;--green:#22c55e;--red:#ef4444;--gold:#fbbf24;--text:#e2e8f0;--dim:#94a3b8}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;z-index:10}
.game-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}.game-title .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.5)}
.header-balance{font-size:12px;color:var(--dim);text-align:right}.header-balance b{color:var(--gold);font-size:14px}
#game-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.game-main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(168,85,247,.08) 0%,transparent 60%)}
.slots-container{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:500px}
.reels{display:flex;gap:8px;background:rgba(0,0,0,.4);padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.06)}
.reel{width:80px;height:240px;background:rgba(255,255,255,.03);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.reel-strip{display:flex;flex-direction:column;transition:transform .3s ease-out}
.symbol{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:40px;border-bottom:1px solid rgba(255,255,255,.04)}
.controls{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border-radius:14px;border:1px solid rgba(255,255,255,.06);width:100%}
.bet-control{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px}
.bet-control button{width:32px;height:32px;border:none;border-radius:6px;background:rgba(255,255,255,.08);color:#e2e8f0;font-size:16px;font-weight:700;cursor:pointer}.bet-control button:hover:not(:disabled){background:#a855f7}
.bv{min-width:70px;text-align:center;font-size:14px;font-weight:700;color:#fbbf24}
.spin-btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 4px 20px rgba(168,85,247,.4);transition:all .15s}
.spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 32px rgba(168,85,247,.6)}
.spin-btn:disabled{background:#334155;color:#94a3b8;cursor:not-allowed;transform:none}
.info-bar{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:10px;width:100%}
.info-label{font-size:11px;color:#94a3b8;text-transform:uppercase}.info-value{font-size:14px;font-weight:700;color:#22c55e}
.history-bar{display:flex;align-items:center;gap:4px;padding:6px 16px;background:rgba(0,0,0,.3);flex-shrink:0;overflow-x:auto;justify-content:flex-end}
.hit{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}.hit.w{background:rgba(34,197,94,.15);color:#22c55e}.hit.l{background:rgba(239,68,68,.15);color:#ef4444}
@media(max-width:640px){.reel{width:60px;height:180px}.symbol{width:60px;height:60px;font-size:28px}}
</style></head><body>
<div id=game-wrap>
<div class=game-header><div class=game-title><span class=dot></span>Cosmic Queen</div><div class=header-balance>Balance: <b id=bal>10,000.00</b></div></div>
<div class=game-main><div class=slots-container>
<div class=reels id=reels><div class=reel><div class=reel-strip id=r0></div></div><div class=reel><div class=reel-strip id=r1></div></div><div class=reel><div class=reel-strip id=r2></div></div><div class=reel><div class=reel-strip id=r3></div></div><div class=reel><div class=reel-strip id=r4></div></div></div>
<div class=info-bar><div><span class=info-label>Win</span><br/><span class=info-value id=win-display>-</span></div><div style=text-align:right><span class=info-label>Mult</span><br/><span class=info-value id=mult-display>-</span></div></div>
<div class=controls><div class=bet-control><button onclick=aB(-10)>-</button><span class=bv id=bet-disp>10.00</span><button onclick=aB(10)>+</button></div><button class=spin-btn id=spin-btn onclick=spin()>SPIN</button></div>
</div></div>
<div class=history-bar id=hist></div>
</div>
<script type=module>const S={b:10000,bet:10,sp:false,h:[]};const syms=['🍒','🍋','🍊','🍇','💎','7️⃣','⭐','🔔'];const pay={'🍒':2,'🍋':3,'🍊':5,'🍇':8,'🔔':12,'⭐':20,'7️⃣':50,'💎':100};
function init(){for(let i=0;i<5;i++){const s=document.getElementById('r'+i);s.innerHTML='';for(let j=0;j<3;j++){const d=document.createElement('div');d.className='symbol';d.textContent=syms[Math.floor(Math.random()*syms.length)];s.appendChild(d)}}}
function gS(){const r=Math.random();if(r<.35)return'🍒';if(r<.55)return'🍋';if(r<.70)return'🍊';if(r<.82)return'🍇';if(r<.90)return'🔔';if(r<.96)return'⭐';if(r<.99)return'7️⃣';return'💎'}
function spin(){if(S.sp)return;S.sp=true;document.getElementById('spin-btn').disabled=true;const res=[];for(let i=0;i<5;i++)res.push(gS());
for(let i=0;i<5;i++){const s=document.getElementById('r'+i);s.style.transition='transform .5s ease-out';s.style.transform='translateY(-'+(Math.floor(Math.random()*3)+1)*80+'px)'}
setTimeout(function(){for(let i=0;i<5;i++){const s=document.getElementById('r'+i);s.innerHTML='';for(let j=0;j<3;j++){const d=document.createElement('div');d.className='symbol';if(j===1)d.textContent=res[i];else d.textContent=syms[Math.floor(Math.random()*syms.length)];s.appendChild(d)}s.style.transition='transform .3s ease-out';s.style.transform='translateY(0)'}
let w=0;const first=res[0];let c=0;for(const x of res){if(x===first)c++;else break}if(c>=3){w=S.bet*pay[first]*(c-2);S.b+=w-S.bet;if(w>0){document.getElementById('win-display').textContent='+'+w.toFixed(2);document.getElementById('mult-display').textContent=(w/S.bet).toFixed(1)+'x';document.getElementById('win-display').style.color='#22c55e'}else{S.b-=S.bet;document.getElementById('win-display').textContent='-'+S.bet.toFixed(2);document.getElementById('win-display').style.color='#ef4444'}}
S.h.unshift({w:w>0});if(S.h.length>15)S.h.pop();let h='';for(let i=0;i<S.h.length;i++){h+='<div class="hit '+(S.h[i].w?'w':'l')+'">'+(S.h[i].w?'+':'-')+S.h[i].w.toFixed(0)+'x</div>'}document.getElementById('hist').innerHTML=h;document.getElementById('bal').textContent=S.b.toFixed(2);S.sp=false;document.getElementById('spin-btn').disabled=false},800)}
window.aB=function(d){if(S.sp)return;S.bet=Math.max(1,Math.min(S.b,S.bet+d));document.getElementById('bet-disp').textContent=S.bet.toFixed(2)};init();</script>
<script type=module>import{setupBotOverlay}from'../_engine/core/bot-overlay.js';try{setupBotOverlay('#game-wrap',{gameName:'cosmic-queen',refreshInterval:3000})}catch(e){console.warn('[BotOverlay]',e.message)}</script>
<script type=module>import{initVFX}from'../_engine/core/vfx.js';import{playSound}from'../_engine/core/audio.js';document.querySelectorAll('#game-wrap button').forEach(function(b){b.addEventListener('click',function(){try{playSound('click')}catch(e){}})});try{initVFX({container:document.getElementById('game-wrap'),intensity:'medium'})}catch(e){console.warn('[VFX]',e.message)}</script>
</body></html>
