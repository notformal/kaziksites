<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BetBy Sports</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap');
:root{--bg:#07071a;--sf:#0d0d2b;--purp:#a855f7;--gold:#fbbf24;--green:#10b981;--red:#ef4444;--txt:#f8fafc;--tdim:#cbd5e1}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--txt)}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100vh}
.header{padding:12px 16px;background:rgba(13,13,43,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06)}
.header h1{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;color:var(--gold)}
.sport-tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.sport-tab{padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#cbd5e1;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s}
.sport-tab.active{background:rgba(168,85,247,.2);border-color:var(--purp);color:#fff}
.live-dot{width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block;margin-right:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.matches{flex:1;overflow-y:auto;padding:8px}
.match-card{background:rgba(13,13,43,.6);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;margin-bottom:8px;transition:all .2s}
.match-card:hover{border-color:rgba(168,85,247,.2)}
.match-league{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;display:flex;align-items:center}
.match-teams{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.team-name{font-size:14px;font-weight:600}
.team-vs{color:#64748b;font-size:12px;margin:0 8px}
.match-time{font-size:11px;color:var(--gold);font-weight:700}
.odds-row{display:flex;gap:4px}
.odd-btn{flex:1;padding:8px 4px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#cbd5e1;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.odd-btn:hover{background:rgba(168,85,247,.1);border-color:rgba(168,85,247,.3)}
.odd-btn.sel{background:rgba(168,85,247,.2);border-color:var(--purp);color:#fff}
.odd-val{display:block;font-weight:800;color:var(--gold);font-size:13px;margin-top:2px}
.bet-slip{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,13,43,.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);padding:12px 16px}
.bet-slip-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bet-slip-title{font-size:13px;font-weight:700;color:var(--gold)}
.bet-count{background:var(--purp);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.bet-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.bet-item-teams{font-size:12px;color:#cbd5e1}
.bet-item-odd{color:var(--gold);font-weight:700;font-size:13px}
.remove-bet{background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:0 4px}
.bet-input-row{display:flex;gap:8px;margin-top:8px}
.bet-amount{flex:1;padding:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-size:14px}
.bet-amount:focus{outline:none;border-color:var(--purp)}
.place-bet-btn{padding:8px 20px;background:linear-gradient(135deg,var(--green),#059669);color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer}
.bet-summary{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;color:#94a3b8}
.potential-win{color:var(--gold);font-weight:700}
.stats-bar{display:flex;gap:12px;padding:8px 16px;background:rgba(13,13,43,.8);border-top:1px solid rgba(255,255,255,.04);font-size:11px;color:#94a3b8}
.stat{display:flex;align-items:center;gap:4px}
.stat-val{color:var(--gold);font-weight:700}
</style></head><body>
<div id="app">
  <div class="header">
    <h1>BetBy Sports</h1>
    <div class="sport-tabs">
      <button class="sport-tab active" data-sport="football">вљЅ Football</button>
      <button class="sport-tab" data-sport="basketball">рџЏЂ Basketball</button>
      <button class="sport-tab" data-sport="tennis">рџЋѕ Tennis</button>
      <button class="sport-tab" data-sport="hockey">рџЏ’ Hockey</button>
      <button class="sport-tab" data-sport="esports">рџЋ® Esports</button>
    </div>
  </div>
  <div class="matches" id="matches"></div>
  <div class="bet-slip" id="slip">
    <div class="bet-slip-header"><span class="bet-slip-title">Bet Slip <span class="bet-count" id="betCount">0</span></span><button onclick="clearAll()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:12px">Clear All</button></div>
    <div id="slipItems"></div>
    <div class="bet-input-row"><input type="number" class="bet-amount" id="betAmount" placeholder="Bet amount" value="10" min="1"><button class="place-bet-btn" onclick="placeBet()">PLACE BET</button></div>
    <div class="bet-summary"><span>Total Stake: <span id="totalStake">$0</span></span><span>Potential Win: <span class="potential-win" id="potentialWin">$0</span></span></div>
  </div>
  <div class="stats-bar"><span class="stat">Live Events: <span class="stat-val" id="liveCount">0</span></span><span class="stat">Today's Markets: <span class="stat-val">1,247</span></span></div>
</div>
import{initOverlay} from "../_engine/core/premium-overlay.js";initOverlay({brand:"aurora",sportBetting:true})
 }
 }
