<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetBy Sports — Ставки на спорт</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="sports-header">
    <div class="header-left">
      <div class="logo">⚽ BetBy Sports</div>
      <nav class="sport-nav">
        <button class="sport-btn active" data-sport="football">⚽ Футбол</button>
        <button class="sport-btn" data-sport="basketball">🏀 Баскетбол</button>
        <button class="sport-btn" data-sport="tennis">🎾 Теннис</button>
        <button class="sport-btn" data-sport="hockey">🏒 Хоккей</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="balance-display">
        <span class="balance-label">Баланс:</span>
        <span class="balance-amount" id="balance">$10,000.00</span>
      </div>
      <button class="live-toggle" id="liveToggle">🔴 Live</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="sports-container">
    <!-- Left Panel — Leagues -->
    <aside class="leagues-panel">
      <h3>🏆 Лиги</h3>
      <div class="league-list" id="leagueList">
        <!-- Populated by JS -->
      </div>
    </aside>

    <!-- Center — Events & Odds -->
    <main class="events-panel">
      <!-- Upcoming Events -->
      <section class="events-section">
        <h3>📅 Предстоящие события</h3>
        <div class="events-list" id="eventsList">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Live Events -->
      <section class="events-section live-section" id="liveSection" style="display:none;">
        <h3>🔴 Live События</h3>
        <div class="events-list" id="liveEventsList">
          <!-- Populated by JS -->
        </div>
      </section>
    </main>

    <!-- Right Panel — Bet Slip -->
    <aside class="betslip-panel">
      <h3>🎫 Купон ставок</h3>
      <div class="betslip-content" id="betslipContent">
        <p class="empty-betslip">Добавьте события в купон для размещения ставки</p>
      </div>
      <div class="betslip-summary" id="betslipSummary" style="display:none;">
        <div class="summary-row">
          <span>Общая ставка:</span>
          <span id="totalStake">$0.00</span>
        </div>
        <div class="summary-row potential-win">
          <span>Потенциальный выигрыш:</span>
          <span id="potentialWin">$0.00</span>
        </div>
        <button class="place-bet-btn" id="placeBetBtn">Поставить</button>
        <button class="clear-betslip-btn" id="clearBetslipBtn">Очистить</button>
      </div>
      <section class="bets-history" id="betsHistory">
        <h3>📊 История ставок</h3>
        <div id="betHistoryList"></div>
      </section>
    </aside>
  </div>

  <!-- Toast Container -->
  <div class="toast-container"></div>

  <script src="js/game.js"></script>
</body>
</html>
