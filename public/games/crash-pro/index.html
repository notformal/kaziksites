<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crash Pro — KazikSites</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e27;--panel:rgba(16,20,50,0.8);--accent:#a855f7;--green:#22c55e;--red:#ef4444;--gold:#fbbf24;--text:#e2e8f0;--dim:#94a3b8}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
body{display:flex;flex-direction:column}
#game-wrap{position:relative;width:100%;flex:1;display:flex;flex-direction:column;min-height:0}

/* Header Bar */
.game-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;z-index:10}
.game-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.game-title .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.5)}
.header-balance{font-size:12px;color:var(--dim);text-align:right}
.header-balance b{color:var(--gold);font-size:14px}

/* Canvas area */
#canvas-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,rgba(168,85,247,0.06) 0%,transparent 60%),var(--bg);overflow:hidden}
#crash-canvas{display:block;width:100%;height:100%}

/* Multiplier Display */
#multiplier-display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:2}
#mult-value{font-size:clamp(48px,10vw,96px);font-weight:900;line-height:1;text-shadow:0 0 40px currentColor;transition:color .15s}
#mult-value.running{color:var(--text)}
#mult-value.crashed{color:var(--red);animation:crashShake .3s ease-out}
#mult-value.cashed{color:var(--green)}
@keyframes crashShake{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}
#round-status{font-size:13px;color:var(--dim);margin-top:8px;text-transform:uppercase;letter-spacing:0.1em}

/* Controls */
.game-controls{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0;z-index:10;flex-wrap:wrap;justify-content:center}
.bet-control{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:4px}
.bet-control button{width:32px;height:32px;border:none;border-radius:6px;background:rgba(255,255,255,0.08);color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
.bet-control button:hover:not(:disabled){background:var(--accent)}
.bet-value{min-width:70px;text-align:center;font-size:14px;font-weight:700;color:var(--gold)}
.action-btn{padding:10px 28px;border:none;border-radius:10px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;cursor:pointer;transition:all .15s}
.action-btn.play{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 16px rgba(34,197,94,0.3)}
.action-btn.play:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 24px rgba(34,197,94,0.5)}
.action-btn.cashout{background:linear-gradient(135deg,var(--gold),var(--accent-gold-dark));color:#000;animation:cashPulse 0.8s ease-in-out infinite}
@keyframes cashPulse{0%,100%{box-shadow:0 0 20px rgba(251,191,36,0.3)}50%{box-shadow:0 0 40px rgba(251,191,36,0.6)}}
.action-btn.waiting{background:#334155;color:var(--dim);cursor:not-allowed}

/* History bar */
.history-bar{display:flex;align-items:center;gap:4px;padding:6px 16px;background:rgba(0,0,0,0.3);flex-shrink:0;overflow-x:auto;justify-content:flex-end}
.history-item{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.history-item.high{background:rgba(34,197,94,0.15);color:var(--green)}
.history-item.mid{background:rgba(168,85,247,0.15);color:#a78bfa}
.history-item.low{background:rgba(239,68,68,0.15);color:var(--red)}

/* Responsive */
@media(max-width:640px){.game-controls{gap:4px;padding:8px 8px}.action-btn{padding:8px 16px;font-size:12px}.bet-control{padding:2px}}
</style>
</head>
<body>

<div id="game-wrap">
  <div class="game-header">
    <div class="game-title"><span class="dot"></span>Crash Pro</div>
    <div class="header-balance">Balance: <b id="balance-display">10,000.00</b></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="crash-canvas"></canvas>
    <div id="multiplier-display">
      <div id="mult-value" class="running">1.00x</div>
      <div id="round-status">Next round in 5s</div>
    </div>
  </div>

  <div class="history-bar" id="history-bar"></div>

  <div class="game-controls">
    <div class="bet-control">
      <button onclick="adjustBet(-10)">-</button>
      <span class="bet-value" id="bet-display"></span>
      <button onclick="adjustBet(10)">+</button>
    </div>
    <button class="action-btn play" id="action-btn" onclick="handleAction()">Place Bet</button>
  </div>
</div>

<script type="module">
// ═══ GAME STATE ═══
const state = {
  balance: 10000, bet: 10, running: false, crashed: false, cashedOut: false,
  currentMult: 1.00, targetCrash: 0, startTime: 0,
  playerBet: null, history: [], waiting: true, nextRoundTime: 0,
};

const canvas = document.getElementById("crash-canvas");
const ctx = canvas.getContext("2d");
const multEl = document.getElementById("mult-value");
const statusEl = document.getElementById("round-status");
const actionBtn = document.getElementById("action-btn");
const betDisplay = document.getElementById("bet-display");
const balanceDisplay = document.getElementById("balance-display");
const historyBar = document.getElementById("history-bar");

let points = [];
let animFrame;

// ═══ CANVAS SETUP ═══
function resizeCanvas() {
  const wrap = document.getElementById("canvas-wrap");
  canvas.width = wrap.clientWidth * devicePixelRatio;
  canvas.height = wrap.clientHeight * devicePixelRatio;
  canvas.style.width = wrap.clientWidth + "px";
  canvas.style.height = wrap.clientHeight + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ═══ DRAWING ═══
function drawCurve() {
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  // Grid lines
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 1;
  for (let y = 0; y < h; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

  if (points.length < 2) return;

  const maxMult = Math.max(state.currentMult, 2);
  const curveH = h - 40;
  const curveW = w - 80;

  // Curve line
  const gradient = ctx.createLinearGradient(0, h, w, 0);
  if (!state.crashed) {
    gradient.addColorStop(0, "#22c55e");
    gradient.addColorStop(1, "#a855f7");
  } else {
    gradient.addColorStop(0, "#ef4444");
    gradient.addColorStop(1, "#dc2626");
  }

  ctx.beginPath();
  ctx.strokeStyle = gradient;
  ctx.lineWidth = 3;
  ctx.shadowColor = state.crashed ? "#ef4444" : "#a855f7";
  ctx.shadowBlur = 15;

  for (let i = 0; i < points.length; i++) {
    const x = (i / (points.length - 1)) * curveW + 40;
    const t = Math.min(1, (Math.log(points[i].mult) / Math.log(maxMult || 2)));
    const y = h - 20 - t * curveH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Glow dot at end
  if (points.length > 0) {
    const last = points[points.length - 1];
    const x = curveW + 40;
    const t = Math.min(1, (Math.log(last.mult) / Math.log(maxMult || 2)));
    const y = h - 20 - t * curveH;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = state.crashed ? "#ef4444" : "#a855f7";
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 20;
    ctx.fill();
  }
}

// ═══ GAME LOGIC ═══
function getCrashPoint() {
  // Provably fair-ish: E = 1 / (1 - U) with 4% house edge
  const u = Math.random();
  const crash = Math.max(1, (0.96 / (1 - u)));
  return Math.floor(crash * 100) / 100;
}

function startRound() {
  state.crashed = false;
  state.cashedOut = false;
  state.running = true;
  state.targetCrash = getCrashPoint();
  state.currentMult = 1.00;
  state.startTime = Date.now();
  points = [{ mult: 1.00 }];

  statusEl.textContent = "Round in progress...";
  actionBtn.className = state.playerBet ? "action-btn cashout" : "action-btn waiting";
  actionBtn.textContent = state.playerBet ? Cash Out (3{(state.bet * 1.0).toFixed(2)}) : "Waiting...";

  animate();
}

function crash() {
  state.running = false;
  state.crashed = true;
  multEl.className = "crashed";
  statusEl.textContent = Crashed at x;

  if (state.playerBet && !state.cashedOut) {
    // Lost the bet
    addHistory(state.currentMult, "low");
    state.playerBet = null;
  }

  actionBtn.className = "action-btn waiting";
  actionBtn.textContent = Next round in 3s...;

  setTimeout(() => newRound(), 3000);
}

function cashOut() {
  if (!state.running || state.cashedOut || !state.playerBet) return;
  state.cashedOut = true;
  const winAmount = state.bet * state.currentMult;
  state.balance += winAmount - state.bet;
  updateBalance();

  actionBtn.className = "action-btn waiting";
  actionBtn.textContent = Won 3{winAmount.toFixed(2)}!;
  addHistory(state.currentMult, "high");
}

function newRound() {
  state.waiting = true;
  state.running = false;
  state.crashed = false;
  state.cashedOut = false;
  state.currentMult = 1.00;
  points = [{ mult: 1.00 }];
  state.playerBet = null;

  drawCurve();
  const startCountdown = () => {
    const remaining = Math.ceil((state.nextRoundTime - Date.now()) / 1000);
    if (remaining <= 0) { startRound(); return; }
    statusEl.textContent = Next round in s;
    multEl.className = "running";
    multEl.textContent = ${state.currentMult.toFixed(2)}x;
    actionBtn.className = state.playerBet ? "action-btn play" : "action-btn play";
    actionBtn.textContent = state.playerBet ? "Bet Placed — Ready" : "Place Bet";
    requestAnimationFrame(startCountdown);
  };
  startCountdown();
}

function animate() {
  if (!state.running) return;

  const elapsed = (Date.now() - state.startTime) / 1000;
  state.currentMult = Math.pow(Math.E, 0.07 * elapsed * elapsed);

  if (state.currentMult >= state.targetCrash) {
    state.currentMult = state.targetCrash;
    crash();
    return;
  }

  multEl.className = "running";
  multEl.textContent = ${state.currentMult.toFixed(2)}x;

  points.push({ mult: state.currentMult });
  drawCurve();

  if (state.playerBet && !state.cashedOut) {
    actionBtn.textContent = Cash Out (3{(state.bet * state.currentMult).toFixed(2)});
  }

  animFrame = requestAnimationFrame(animate);
}

// ═══ HISTORY ═══
function addHistory(mult, tier) {
  state.history.unshift({ mult, tier });
  if (state.history.length > 20) state.history.pop();
  renderHistory();
}

function renderHistory() {
  historyBar.innerHTML = state.history.map(h =>
    <span class="history-item ">x</span>
  ).join("");
}

// ═══ API INTEGRATION ═══
async function submitBet() {
  try {
    const res = await fetch(${location.origin}/api/games/crash/spin, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ bet: state.bet / 100 }), // server uses cents
    });
    const data = await res.json();
    if (data.success && data.crashPoint) {
      state.targetCrash = data.crashPoint;
      return true;
    }
  } catch (e) { /* fallback to client-side */ }
  return false;
}

// ═══ CONTROLS ═══
window.adjustBet = function(delta) {
  state.bet = Math.max(10, Math.min(10000, state.bet + delta));
  betDisplay.textContent = $;
};

window.handleAction = async function() {
  if (state.waiting && !state.running) {
    // Place bet for next round
    state.playerBet = true;
    actionBtn.textContent = "Bet Placed ✓";
    return;
  }
  if (state.running && state.playerBet && !state.cashedOut) {
    cashOut();
    return;
  }
};

function updateBalance() { balanceDisplay.textContent = state.balance.toFixed(2); }


// ═══ INIT ═══
updateBalance();
state.nextRoundTime = Date.now() + 5000;
newRound();

window.addEventListener("resize", resizeCanvas);
</script>
