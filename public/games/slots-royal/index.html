<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Slots Royal</title>
<meta name="description" content="Slots Royal — 20-line video slot, 96.00% RTP, high volatility. Demo credits only.">
<style>
  html,body{margin:0;height:100%;background:#06070c}
  #game{position:fixed;inset:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center;color:#8d93ab;
    font:600 13px/1.6 "Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
  #boot[data-error="true"]{color:#ff6b81}
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">Loading Slots Royal…</div>
<script type="module">
  import { bootSlot } from '../_engine/slot-engine.js';

  const boot = document.getElementById('boot');
  try {
    const engine = await bootSlot({ parent: document.getElementById('game') });
    boot.remove();
    // Exposed for automated QA and for the lobby's iframe integration.
    window.__game = engine;
    window.dispatchEvent(new CustomEvent('game:ready', { detail: { id: "slots-royal" } }));
  } catch (error) {
    boot.dataset.error = 'true';
    boot.textContent = 'Could not start Slots Royal: ' + error.message;
    console.error(error);
  }
</script>
</body>
</html>
