<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lightning Dice</title>
<meta name="description" content="Lightning Dice — three dice, sixteen totals, lightning multipliers up to 50×. 96.19% RTP. Demo credits only.">
<style>
  html,body{margin:0;height:100%;background:#06070c}
  #game{position:fixed;inset:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center;color:#8d93ab;
    font:600 13px/1.6 "Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
  #boot[data-error="true"]{color:#ff6b81}
</style>
</head>
<body>
<div id="game"></div>
<div id="boot">Loading Lightning Dice…</div>
<script type="module">
  import { bootDice } from '../_engine/dice-engine.js';

  const boot = document.getElementById('boot');
  try {
    const engine = await bootDice({ parent: document.getElementById('game') });
    boot.remove();
    window.__game = engine;
    window.dispatchEvent(new CustomEvent('game:ready', { detail: { id: 'lightning-dice' } }));
  } catch (error) {
    boot.dataset.error = 'true';
    boot.textContent = 'Could not start Lightning Dice: ' + error.message;
    console.error(error);
  }
</script>
</body>
</html>
