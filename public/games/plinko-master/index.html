<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="description" content="Plinko Master v3 — Physics-based Ball Drop Game with Multiplier Buckets">
<title>Plinko Master v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap');
/* ═══════════════════════════════════════════
   PLINKO MASTER v3 — PREMIUM DESIGN SYSTEM
   Playson-Style | House Edge: 4% | RTP: 96%
   Glassmorphism • Neon Glow • Animated Backgrounds
   ═══════════════════════════════════════════ */
:root{
  --bg:#07071a;--sf:#0d0d2b;--sfl:#13133d;
  --purp:#a855f7;--purp-dark:#7c3aed;--purp-light:#c084fc;
  --gold:#fbbf24;--gold-dark:#d97706;
  --green:#10b981;--green-dark:#059669;
  --red:#ef4444;--red-dark:#dc2626;
  --blue:#3b82f6;--blue-dark:#2563eb;
  --cyan:#06b6d4;--pink:#ec4899;
  --txt:#f8fafc;--tdim:#cbd5e1;--tdim2:#94a3b8;--tdim3:#64748b;
  --brd:rgba(168,85,247,.25);
  --r:10px;--rm:14px;--rl:20px;--rxl:24px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --shadow-glow-purple:0 0 25px rgba(168,85,247,.35),0 0 50px rgba(168,85,247,.15);
  --shadow-glow-gold:0 0 25px rgba(251,191,36,.35),0 0 50px rgba(251,191,36,.15);
  --shadow-glow-green:0 0 25px rgba(16,185,129,.35),0 0 50px rgba(16,185,129,.15);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-x:hidden;background:var(--bg);font-family:var(--font);color:var(--txt);-webkit-tap-highlight-color:transparent}

/* ── Animated Background ── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.12;animation:orbFloat 25s ease-in-out infinite}
.bg-orb:nth-child(1){width:450px;height:450px;background:var(--purp);top:-15%;left:-10%;animation-delay:0s}
.bg-orb:nth-child(2){width:380px;height:380px;background:var(--cyan);bottom:-12%;right:-8%;animation-delay:-8s}
.bg-orb:nth-child(3){width:300px;height:300px;background:var(--pink);top:45%;left:55%;animation-delay:-16s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(40px,-50px) scale(1.08)}50%{transform:translate(-30px,30px) scale(.92)}75%{transform:translate(50px,40px) scale(1.04)}}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:80px 80px;animation:gridPulse 10s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.4}50%{opacity:.9}}

#app{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;overflow:hidden;padding:10px 8px}

/* ── Header ── */
.header{width:100%;max-width:540px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(13,13,43,.8);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.06);border-radius:var(--rxl);flex-shrink:0;transition:all .3s}
.header:hover{border-color:rgba(168,85,247,.2)}
.hdr-l{display:flex;align-items:center;gap:12px}
.logo{font-size:30px;cursor:pointer;filter:drop-shadow(0 0 12px rgba(251,191,36,.5));transition:all .3s cubic-bezier(.34,1.56,.64,1)}
.logo:hover{transform:scale(1.15) rotate(12deg);filter:drop-shadow(0 0 18px rgba(251,191,36,.7))}
.ttl{font-family:'Poppins',sans-serif;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--purp-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.01em}
.sub{font-size:9px;color:var(--tdim3);letter-spacing:.12em;text-transform:uppercase;margin-top:-1px}
.bal{display:flex;flex-direction:column;align-items:center;padding:8px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);min-width:120px;transition:all .3s}
.bal:hover{border-color:rgba(168,85,247,.25);background:rgba(255,255,255,.05)}
.bl{font-size:8px;color:var(--tdim3);text-transform:uppercase;letter-spacing:.1em}
.bv{font-family:'Poppins',sans-serif;font-size:17px;font-weight:800;color:var(--green);transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.bv.pulse{animation:bp .5s ease}
@keyframes bp{0%{transform:scale(1)}50%{transform:scale(1.18);color:var(--gold);text-shadow:0 0 25px rgba(251,191,36,.6)}100%{transform:scale(1)}}

.sm{width:100%;max-width:540px;flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 0;position:relative}

/* ── Plinko Area ── */
.plinko-area{width:100%;aspect-ratio:1/1.2;background:linear-gradient(180deg,rgba(7,7,26,.95) 0%,rgba(13,13,43,.98) 100%);border:1px solid rgba(255,255,255,.06);border-radius:var(--rxl);position:relative;overflow:hidden;min-height:280px;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04)}
.plinko-area::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(168,85,247,.06) 0%,transparent 60%);pointer-events:none}
.plinko-canvas{width:100%;height:100%}
.bucket{position:absolute;bottom:0;display:flex;gap:3px;padding:6px;justify-content:center}
.bucket-item{padding:8px 3px;border-radius:var(--r);font-size:11px;font-weight:700;text-align:center;border:1px solid;min-width:32px;transition:all .2s}
.bucket-item.high{background:rgba(251,191,36,.12);color:var(--gold);border-color:rgba(251,191,36,.25)}
.bucket-item.mid{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.2)}
.bucket-item.low{background:rgba(239,68,68,.08);color:var(--red);border-color:rgba(239,68,68,.18)}

/* ── History Bar ── */
.history-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 0}
.hist-item{padding:5px 12px;border-radius:var(--rm);font-size:12px;font-weight:700;border:1px solid;animation:histIn .3s ease}
@keyframes histIn{from{opacity:0;transform:translateY(-8px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.hist-item.high{background:rgba(251,191,36,.12);color:var(--gold);border-color:rgba(251,191,36,.25)}
.hist-item.mid{background:rgba(16,185,129,.1);color:var(--green);border-color:rgba(16,185,129,.2)}
.hist-item.low{background:rgba(239,68,68,.08);color:var(--red);border-color:rgba(239,68,68,.18)}

/* ── Panels ── */
.bet-panel{padding:14px;background:rgba(13,13,43,.7);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.06);border-radius:var(--rxl);transition:all .3s}
.bet-panel:hover{border-color:rgba(168,85,247,.15)}
.bet-title{font-size:10px;color:var(--tdim3);text-transform:uppercase;letter-spacing:.15em;text-align:center;margin-bottom:10px;font-weight:600}
.bet-ctrl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:4px 0}

/* ── Inputs ── */
.bet-inp{width:85px;padding:11px 8px;background:var(--sfl);border:2px solid rgba(255,255,255,.06);border-radius:var(--r);color:var(--gold);font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;text-align:center;transition:all .3s}
.bet-inp:focus{outline:none;border-color:var(--purp);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}

/* ── Small Buttons ── */
.bet-sm{padding:9px 14px;border:1px solid rgba(255,255,255,.08);border-radius:var(--r);background:rgba(255,255,255,.03);color:var(--tdim);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;min-height:40px}
.bet-sm:hover{border-color:var(--gold);color:var(--txt);background:rgba(251,191,36,.08);transform:translateY(-1px)}
.bet-sm:active{transform:translateY(0) scale(.97)}

/* ── Main Buttons ── */
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.btn{padding:15px 32px;border:none;border-radius:var(--rm);font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);text-transform:uppercase;letter-spacing:.08em;min-width:95px;text-align:center;position:relative;overflow:hidden;user-select:none}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 50%);opacity:0;transition:opacity .2s}
.btn:hover::before{opacity:1}
.btn:hover:not(:disabled){transform:translateY(-3px)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,var(--purp),var(--purp-dark));color:#fff;box-shadow:0 4px 15px rgba(168,85,247,.3)}
.btn.primary:hover:not(:disabled){box-shadow:0 8px 30px rgba(168,85,247,.4),var(--shadow-glow-purple)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;box-shadow:0 4px 15px rgba(251,191,36,.3)}
.btn.gold:hover:not(:disabled){box-shadow:0 8px 30px rgba(251,191,36,.4),var(--shadow-glow-gold)}
.btn.danger{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;box-shadow:0 4px 15px rgba(239,68,68,.25)}
.btn.danger:hover:not(:disabled){box-shadow:0 8px 30px rgba(239,68,68,.35)}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),#0891b2);color:#fff;box-shadow:0 4px 15px rgba(6,182,212,.25)}
.btn.cyan:hover:not(:disabled){box-shadow:0 8px 30px rgba(6,182,212,.35)}

/* ── Toast Notifications ── */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:14px 28px;border-radius:var(--rm);font-size:15px;font-weight:700;z-index:999;animation:tIn .3s ease,tOut .3s ease 2.5s forwards;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.toast.g{background:rgba(13,13,43,.92);color:var(--gold);border:1px solid var(--gold);box-shadow:0 0 35px rgba(251,191,36,.3),0 8px 32px rgba(0,0,0,.4)}
.toast.gr{background:rgba(13,13,43,.92);color:var(--green);border:1px solid var(--green);box-shadow:0 0 35px rgba(16,185,129,.3),0 8px 32px rgba(0,0,0,.4)}
.toast.r{background:rgba(13,13,43,.92);color:var(--red);border:1px solid var(--red);box-shadow:0 0 35px rgba(239,68,68,.3),0 8px 32px rgba(0,0,0,.4)}
.toast.p{background:rgba(13,13,43,.92);color:var(--purp-light);border:1px solid var(--purp);box-shadow:0 0 35px rgba(168,85,247,.3),0 8px 32px rgba(0,0,0,.4)}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(-15px) scale(.95)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes tOut{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(-15px)}}

/* ── Paytable ── */
.paytable{max-width:540px;width:100%;background:rgba(13,13,43,.85);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.06);border-radius:var(--rxl);overflow:hidden;display:none;animation:pts .3s ease}
.paytable.show{display:block}
@keyframes pts{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.pth{padding:12px 16px;background:var(--sfl);border-bottom:1px solid rgba(255,255,255,.06);font-weight:700;font-size:13px;color:var(--gold);text-align:center}
.png{padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pi{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);background:rgba(255,255,255,.02);border:1px solid transparent;transition:all .2s}
.pi:hover{border-color:rgba(168,85,247,.2);background:rgba(255,255,255,.04)}
.pi .sy{font-size:22px}
.pi .vl{font-size:10px;color:var(--tdim2)}
.pi .vl span{color:var(--gold);font-weight:700}

@media(max-width:400px){
  .btn{padding:13px 22px;font-size:12px;min-width:80px}
  .bet-inp{width:70px;font-size:15px}
  .header{padding:10px 12px}
  .ttl{font-size:14px}
  .bucket-item{font-size:9px;padding:5px 2px;min-width:26px}
}
@media(min-width:768px){
  #app{padding:16px}
}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div id="app">
  <div class="header">
    <div class="hdr-l"><span class="logo" id="logo-btn" role="button" tabindex="0" aria-label="Paytable">🎯</span><div><div class="ttl" id="gt">PLINKO MASTER v3</div><div class="sub" data-i18n="subtitle">Ball Drop Game</div></div></div>
    <div class="bal"><div class="bl" data-i18n="balance">Balance</div><div class="bv" id="bal-display">$10,000</div></div>
  </div>
  <div class="sm">
    <div class="history-bar" id="hist"></div>
    <div class="plinko-area" id="plinko-area">
      <canvas class="plinko-canvas" id="plinko-canvas"></canvas>
    </div>
    <div class="bet-panel">
      <div class="bet-title" data-i18n="bet_amount">Bet Amount</div>
      <div class="bet-ctrl">
        <input type="number" class="bet-inp" id="bet-inp" value="10" min="1" max="1000" step="1" aria-label="Bet amount">
        <button class="bet-sm" id="btn-half" data-i18n="half">½</button>
        <button class="bet-sm" id="btn-double" data-i18n="double">2×</button>
        <button class="bet-sm" id="btn-max" data-i18n="max">MAX</button>
        <button class="bet-sm cyan" id="btn-balls" data-i18n="balls">🎱 BALLS: 1</button>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="btn-drop" data-i18n-attr="text:drop">🎯 DROP</button>
    </div>
  </div>
</div>
<div class="paytable" id="paytable"><div class="pth" data-i18n="paytable">🎯 PLINKO MASTER v3 — Multipliers</div><div class="png" id="pg"></div></div>
<script>
/* ═══════════════════════════════════════════════════════════
   PLINKO MASTER v3 — BALL DROP GAME
   Config-driven | House Edge: 4% | RTP: 96%
   ═══════════════════════════════════════════════════════════ */
const C = Object.freeze({
  id: 'plinko-master', version: '3.0.0', name: 'Plinko Master',
  houseEdge: 0.04, rtp: 0.96,
  betMin: 1, betMax: 1000, betSteps: [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000],
  rows: 12, ballCount: 1,
  multipliers: Object.freeze([10, 5, 3, 2, 1.5, 1, 0.7, 0.5, 0.7, 1, 1.5, 2, 3, 5, 10]),
  anim: { dropInterval: 300, toastDuration: 2000 },
  sound: { enabled: true, masterVolume: 0.5 },
  defaultLang: 'en', supportedLangs: ['en','es','fr','de','jp','ru','zh','ko','pt','ar']
});

const I18N = Object.freeze({
  en: { subtitle:'Ball Drop Game', balance:'Balance', bet_amount:'Bet Amount', paytable:'🎯 PLINKO MASTER v3 — Multipliers', drop:'🎯 DROP', balls:'🎱 BALLS', not_enough:'Not enough balance!', won:'You won!', lost:'Ball lost', half:'½', double:'2×', max:'MAX' },
  es: { subtitle:'Juego de Caída de Bolas', balance:'Saldo', bet_amount:'Cantidad de Apuesta', paytable:'🎯 PLINKO MASTER v3 — Multiplicadores', drop:'🎯 SOLTAR', balls:'🎱 BOLAS', not_enough:'¡Saldo insuficiente!', won:'¡Ganaste!', lost:'Bola perdida', half:'½', double:'2×', max:'MAX' },
  fr: { subtitle:'Jeu de Chute de Balle', balance:'Solde', bet_amount:'Montant de Pari', paytable:'🎯 PLINKO MASTER v3 — Multiplicateurs', drop:'🎯 LACHER', balls:'🎱 BALLES', not_enough:'Solde insuffisant!', won:'Vous avez gagné!', lost:'Balle perdue', half:'½', double:'2×', max:'MAX' },
  de: { subtitle:'Kugel-Fallspiel', balance:'Guthaben', bet_amount:'Wetteinsatz', paytable:'🎯 PLINKO MASTER v3 — Multiplikatoren', drop:'🎯 ABWERFEN', balls:'🎱 KUGELN', not_enough:'Ungenügend Guthaben!', won:'Sie haben gewonnen!', lost:'Kugel verloren', half:'½', double:'2×', max:'MAX' },
  jp: { subtitle:'ボールドロップゲーム', balance:'残高', bet_amount:'ベット額', paytable:'🎯 PLINKO MASTER v3 — 倍率', drop:'🎯 ドロップ', balls:'🎱 ボール', not_enough:'残高不足！', won:'勝ち！', lost:'ボール消失', half:'½', double:'2×', max:'MAX' },
  ru: { subtitle:'Игра с Падением Шаров', balance:'Баланс', bet_amount:'Сумма ставки', paytable:'🎯 PLINKO MASTER v3 — Множители', drop:'🎯 БРОСИТЬ', balls:'🎱 ШАРЫ', not_enough:'Недостаточно средств!', won:'Вы выиграли!', lost:'Шар потерян', half:'½', double:'2×', max:'MAX' },
  zh: { subtitle:'球掉落游戏', balance:'余额', bet_amount:'投注金额', paytable:'🎯 PLINKO MASTER v3 — 乘数', drop:'🎯 投放', balls:'🎱 球数', not_enough:'余额不足！', won:'你赢了！', lost:'球丢失', half:'½', double:'2×', max:'MAX' },
  ko: { subtitle:'볼 드롭 게임', balance:'잔액', bet_amount:'베팅 금액', paytable:'🎯 PLINKO MASTER v3 — 배수', drop:'🎯 드롭', balls:'🎱 공', not_enough:'잔액 부족!', won:'승리!', lost:'공 잃음', half:'½', double:'2×', max:'MAX' },
  pt: { subtitle:'Jogo de Queda de Bolas', balance:'Saldo', bet_amount:'Valor da Aposta', paytable:'🎯 PLINKO MASTER v3 — Multiplicadores', drop:'🎯 SOLTAR', balls:'🎱 BOLAS', not_enough:'Saldo insuficiente!', won:'Você ganhou!', lost:'Bola perdida', half:'½', double:'2×', max:'MAX' },
  ar: { subtitle:'لعبة سقوط الكرات', balance:'الرصيد', bet_amount:'مبلغ الرهان', paytable:'🎯 PLINKO MASTER v3 — المضاعفات', drop:'🎯 إسقاط', balls:'🎱 كرات', not_enough:'الرصيد غير كاف!', won:'فزت!', lost:'كرة ضاعت', half:'½', double:'2×', max:'MAX' }
});

let lang = localStorage.getItem('plinko-lang') || 'en';
if (!I18N[lang]) lang = 'en';
function t(k, p) { let s = I18N[lang]?.[k] || I18N.en[k] || k; if (p) { for (const [k2, v2] of Object.entries(p)) s = s.replace('{' + k2 + '}', v2); } return s; }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-attr]').forEach(e => { const [a, k] = e.getAttribute('data-i18n-attr').split(':'); e[a] = t(k); });
}
function switchLang() { const ls = C.supportedLangs; const i = ls.indexOf(lang); lang = ls[(i + 1) % ls.length]; localStorage.setItem('plinko-lang', lang); applyI18n(); showToast('🌐 ' + lang.toUpperCase(), 'p'); }

let actx = null;
function getActx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function tone(f, d, type = 'sine', v = 0.3) {
  if (!C.sound.enabled) return;
  try { const c = getActx(), o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, c.currentTime); g.gain.setValueAtTime(v * C.sound.masterVolume, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + d); } catch (e) {}
}
const SND = {
  click: () => tone(800, 0.04, 'sine', 0.15),
  drop: () => tone(500, 0.1, 'triangle', 0.2),
  bounce: () => tone(600 + Math.random() * 200, 0.03, 'sine', 0.08),
  win: (m) => { if (m >= 3) { tone(880, 0.2, 'sine', 0.4); setTimeout(() => tone(1100, 0.3, 'sine', 0.35), 100); } else { tone(660, 0.15, 'sine', 0.3); } },
  lose: () => tone(200, 0.2, 'sine', 0.1)
};

function showToast(m, t = 'g') { const e = document.createElement('div'); e.className = 'toast ' + t; e.textContent = m; document.body.appendChild(e); setTimeout(() => e.remove(), C.anim.toastDuration + 500); }

// ── Seeded PRNG for plinko (Mulberry32) ──────────────────────
// Seeded from crypto.getRandomValues for unpredictability.

function _plinkoSeedFromCrypto() {
  const bytes = new Uint8Array(4);
  if (globalThis.crypto?.getRandomValues) {
    globalThis.crypto.getRandomValues(bytes);
  } else {
    for (let i = 0; i < 4; i++) bytes[i] = Math.floor(Math.random() * 256);
  }
  return (bytes[0] << 24) | (bytes[1] << 16) | (bytes[2] << 8) | bytes[3];
}

let _plinkoSeed = _plinkoSeedFromCrypto();

/** Mulberry32: fast, seeded 32-bit PRNG with full 2^32 period */
function mulberry32plinko(seed) {
  let s = (seed | 0) >>> 0;
  return function() {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Generate peg positions
function generatePegs() {
  const pegs = []; const rows = C.rows;
  for (let row = 0; row < rows; row++) {
    const pegsInRow = row + 3;
    for (let col = 0; col < pegsInRow; col++) {
      pegs.push({ x: col, y: row, r: 4 });
    }
  }
  return pegs;
}

// Simulate ball path with seeded PRNG — binomial distribution for bell curve
function simulateBall() {
  // Generate fresh seed from crypto each drop so every ball is independent
  let seed;
  if (globalThis.crypto?.getRandomValues) {
    const nb = new Uint8Array(4);
    globalThis.crypto.getRandomValues(nb);
    seed = (nb[0] << 24) | (nb[1] << 16) | (nb[2] << 8) | nb[3];
  } else {
    seed = (_plinkoSeed * 1664525 + 1013904223) >>> 0;
  }
  const rng = mulberry32plinko(seed);
  const rows = C.rows;
  // Each row: ball goes right (1) or stays (0) — binomial distribution
  // Center of bell curve = rows / 2, range = [0, rows]
  let rightCount = 0;
  for (let row = 0; row < rows; row++) {
    if (rng() >= 0.5) rightCount++;
  }
  // Map binomial result [0, rows] to bucket index [0, multipliers.length - 1]
  const bucketIdx = Math.round((rightCount / rows) * (C.multipliers.length - 1));
  return Math.max(0, Math.min(bucketIdx, C.multipliers.length - 1));
}

function getBucketColor(m) {
  if (m >= 3) return 'high';
  if (m >= 1) return 'mid';
  return 'low';
}

let S = { balance: 10000, betAmount: 10, ballCount: 1, history: [] };

// ── Ball animation state ──────────────────────────────────────
const activeBalls = []; // Array of {x, y, vx, vy, radius, opacity, trail:[]}
let animFrameId = null;

function updateBal() { const e = document.getElementById('bal-display'); e.textContent = '$' + S.balance.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 }); e.classList.add('pulse'); setTimeout(() => e.classList.remove('pulse'), 500); }
function renderHist() { const b = document.getElementById('hist'); b.innerHTML = ''; S.history.slice(0, 15).forEach(h => { const i = document.createElement('div'); const cls = h.multiplier >= 3 ? 'high' : (h.multiplier >= 1 ? 'mid' : 'low'); i.className = 'hist-item ' + cls; i.textContent = h.multiplier + '×'; b.appendChild(i); }); }
function renderPaytable() { const g = document.getElementById('pg'); g.innerHTML = ''; C.multipliers.forEach((m, i) => { const pi = document.createElement('div'); pi.className = 'pi'; const color = getBucketColor(m); pi.innerHTML = '<span class="sy">' + (color === 'high' ? '🏆' : (color === 'mid' ? '⭐' : '💀')) + '</span><div class="vl"><span>' + m + '×</span></div>'; g.appendChild(pi); }); }
function renderBuckets() { const area = document.getElementById('plinko-area'); const existing = area.querySelector('.bucket'); if (existing) existing.remove(); const bucket = document.createElement('div'); bucket.className = 'bucket'; const w = area.offsetWidth; const bw = Math.min(w / C.multipliers.length - 2, 40); C.multipliers.forEach((m, i) => { const item = document.createElement('div'); item.className = 'bucket-item ' + getBucketColor(m); item.style.width = bw + 'px'; item.textContent = m + '×'; bucket.appendChild(item); }); bucket.style.width = (C.multipliers.length * (bw + 2)) + 'px'; area.appendChild(bucket); }

/** Compute peg positions for drawing */
function getPegPositions() {
  const canvas = document.getElementById('plinko-canvas');
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = canvas.offsetHeight;
  const rows = C.rows;
  const pegSpacingX = w / (rows + 4);
  const pegSpacingY = h / (rows + 2);
  const pegs = generatePegs();
  return pegs.map(p => ({
    x: (p.x - p.y / 2 + rows / 4) * pegSpacingX,
    y: (p.y + 1) * pegSpacingY,
    r: p.r
  }));
}

/** Main animation loop for ball rendering */
function animationLoop() {
  const canvas = document.getElementById('plinko-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth;
  const h = canvas.height = canvas.offsetHeight;
  
  ctx.clearRect(0, 0, w, h);
  
  // Draw pegs
  const pegs = getPegPositions();
  pegs.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(170,0,255,0.4)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,0,255,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });
  
  // Update and draw balls
  for (let i = activeBalls.length - 1; i >= 0; i--) {
    const ball = activeBalls[i];
    
    // Physics: gravity + velocity
    ball.vy += 0.3; // gravity
    ball.x += ball.vx;
    ball.y += ball.vy;
    
    // Peg collision
    for (const peg of pegs) {
      const dx = ball.x - peg.x;
      const dy = ball.y - peg.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = ball.radius + peg.r;
      
      if (dist < minDist) {
        // Bounce: reflect velocity with some energy loss
        const nx = dx / dist;
        const ny = dy / dist;
        const dot = ball.vx * nx + ball.vy * ny;
        ball.vx -= 2 * dot * nx * 0.6; // 0.6 = restitution
        ball.vy -= 2 * dot * ny * 0.6;
        
        // Push ball out of peg
        ball.x = peg.x + nx * (minDist + 1);
        ball.y = peg.y + ny * (minDist + 1);
        
        SND.bounce();
      }
    }
    
    // Trail effect
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();
    
    // Draw trail
    for (let t = 0; t < ball.trail.length; t++) {
      const tp = ball.trail[t];
      const alpha = (t / ball.trail.length) * 0.4 * ball.opacity;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, ball.radius * 0.5 * (t / ball.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(251, 191, 36, ${alpha})`;
      ctx.fill();
    }
    
    // Draw ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(
      ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, 0,
      ball.x, ball.y, ball.radius
    );
    grad.addColorStop(0, `rgba(255, 230, 100, ${ball.opacity})`);
    grad.addColorStop(1, `rgba(251, 191, 36, ${ball.opacity * 0.8})`);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = `rgba(255, 255, 255, ${ball.opacity * 0.5})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Remove if off screen or reached bottom
    if (ball.y > h + 20 || ball.opacity <= 0) {
      activeBalls.splice(i, 1);
    }
  }
  
  // Continue animation if there are active balls
  if (activeBalls.length > 0) {
    animFrameId = requestAnimationFrame(animationLoop);
  } else {
    animFrameId = null;
  }
}

/** Start the animation loop */
function startAnimation() {
  if (!animFrameId) {
    animFrameId = requestAnimationFrame(animationLoop);
  }
}

/** Drop a ball with animation from top */
function animateBallDrop(targetBucketIdx, betAmount) {
  const canvas = document.getElementById('plinko-canvas');
  if (!canvas) return;
  
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  
  // Create ball at top center
  const ball = {
    x: w / 2 + (Math.random() - 0.5) * 10,
    y: -10,
    vx: (Math.random() - 0.5) * 2,
    vy: 0,
    radius: 6,
    opacity: 1,
    trail: []
  };
  
  activeBalls.push(ball);
  startAnimation();
  SND.drop();
  
  // After animation completes, process result
  setTimeout(() => {
    const multiplier = C.multipliers[targetBucketIdx];
    const win = betAmount * multiplier;
    
    S.balance += win;
    updateBal();
    
    if (win >= betAmount) {
      SND.win(multiplier);
      showToast(t('won') + ' ' + multiplier + '× = $' + win.toFixed(2), multiplier >= 3 ? 'g' : 'gr');
    } else {
      SND.lose();
      showToast(t('lost') + ' ' + multiplier + '× — $' + win.toFixed(2), 'r');
    }
    
    S.history.unshift({ multiplier, win });
    renderHist();
  }, 1500); // Animation duration
}

function dropBall() {
  const bet = S.betAmount;
  if (bet > S.balance) { showToast(t('not_enough'), 'r'); return; }
  
  S.balance -= bet;
  updateBal();

  const bucketIdx = simulateBall();
  animateBallDrop(bucketIdx, bet);
}

function setupEvents() {
  document.getElementById('btn-drop').addEventListener('click', () => { SND.click(); for (let i = 0; i < S.ballCount; i++) setTimeout(() => dropBall(), i * C.anim.dropInterval); });
  document.getElementById('bet-inp').addEventListener('change', e => { let v = parseInt(e.target.value) || C.betMin; v = Math.max(C.betMin, Math.min(C.betMax, v)); e.target.value = v; S.betAmount = v; });
  document.getElementById('btn-half').addEventListener('click', () => { SND.click(); S.betAmount = Math.max(C.betMin, Math.floor(S.betAmount / 2)); document.getElementById('bet-inp').value = S.betAmount; });
  document.getElementById('btn-double').addEventListener('click', () => { SND.click(); S.betAmount = Math.min(C.betMax, S.betAmount * 2); document.getElementById('bet-inp').value = S.betAmount; });
  document.getElementById('btn-max').addEventListener('click', () => { SND.click(); S.betAmount = Math.min(C.betMax, S.balance); document.getElementById('bet-inp').value = S.betAmount; });
  document.getElementById('btn-balls').addEventListener('click', () => {
    SND.click(); const idx = C.betSteps.indexOf(S.ballCount); const next = C.betSteps[(idx + 1) % C.betSteps.length]; S.ballCount = next; document.getElementById('btn-balls').textContent = '🎱 BALLS: ' + S.ballCount;
  });
  document.getElementById('logo-btn').addEventListener('dblclick', e => { e.preventDefault(); switchLang(); });
  document.getElementById('logo-btn').addEventListener('click', () => { document.getElementById('paytable').classList.toggle('show'); });
}

function init() { applyI18n(); updateBal(); renderHist(); renderPaytable(); renderBuckets(); 
  const canvas = document.getElementById('plinko-canvas');
  if (canvas) { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
  setupEvents(); window.addEventListener('resize', () => { const c = document.getElementById('plinko-canvas'); if(c){c.width=c.offsetWidth;c.height=c.offsetHeight;} renderBuckets(); }); 
}
init();
</script>
