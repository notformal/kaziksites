<!DOCTYPE html><html lang=en><head><meta charset=UTF-8/><meta name=viewport content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>Plinko Master - KazikSites</title><link rel=preconnect href=https://fonts.googleapis.com/><link href=https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap rel=stylesheet/>
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0e27;--panel:rgba(16,20,50,0.8);--accent:#22c55e;--green:#22c55e;--red:#ef4444;--gold:#fbbf24;--text:#e2e8f0;--dim:#94a3b8}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--panel);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;z-index:10}
.game-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}.game-title .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.5)}
.header-balance{font-size:12px;color:var(--dim);text-align:right}.header-balance b{color:var(--gold);font-size:14px}
#game-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.game-main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;gap:8px;background:radial-gradient(ellipse at 50% 30%,rgba(34,197,94,.06) 0%,transparent 60%)}
.pc{position:relative;width:100%;max-width:420px;height:100%;display:flex;flex-direction:column}
#pcanvas{width:100%;height:100%;border-radius:16px;display:block}
.buckets{display:flex;justify-content:space-between;padding:4px 8px;gap:2px}
.bucket{flex:1;text-align:center;font-size:10px;font-weight:800;padding:4px 2px;border-radius:6px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bk:nth-child(1),.bk:nth-child(2){background:rgba(239,68,68,.4)}.bk:nth-child(3),.bk:nth-child(7){background:rgba(239,68,68,.25)}.bk:nth-child(4),.bk:nth-child(6){background:rgba(168,85,247,.3)}.bk:nth-child(5){background:rgba(34,197,94,.4)}
.gc{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;z-index:10;flex-wrap:wrap;justify-content:center}
.bc{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px}
.bc button{width:32px;height:32px;border:none;border-radius:6px;background:rgba(255,255,255,.08);color:#e2e8f0;font-size:16px;font-weight:700;cursor:pointer}.bc button:hover:not(:disabled){background:var(--accent)}
.bv{min-width:70px;text-align:center;font-size:14px;font-weight:700;color:#fbbf24}
.ab{padding:12px 36px;border:none;border-radius:12px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;transition:all .15s}
.ab.dp{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 20px rgba(34,197,94,.4)}.ab.dp:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 32px rgba(34,197,94,.6)}
.qb{display:flex;gap:4px;margin-left:auto}.qbe{padding:6px 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.06);color:#94a3b8;cursor:pointer;transition:all .15s}.qbe:hover{background:rgba(34,197,94,.2);color:#22c55e}
.hbar{display:flex;align-items:center;gap:4px;padding:6px 16px;background:rgba(0,0,0,.3);flex-shrink:0;overflow-x:auto;justify-content:flex-end}
.hit{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}.hit.hg{background:rgba(34,197,94,.15);color:#22c55e}.hit.mi{background:rgba(168,85,247,.15);color:#a78bfa}.hit.lo{background:rgba(239,68,68,.15);color:#ef4444}
@media(max-width:640px){.gc{gap:4px;padding:8px}.ab{padding:10px 20px;font-size:13px}}
</style></head><body><div id=game-wrap>
<div class=game-header><div class=game-title><span class=dot></span>Plinko Master</div><div class=header-balance>Balance: <b id=balance-display>10,000.00</b></div></div>
<div class=game-main id=main-area><div class=pc><canvas id=pcanvas></canvas><div class=buckets id=bkt-el></div></div></div>
<div class=hbar id=history-bar></div>
<div class=gc><div class=bc><button onclick=aB(-10)>-</button><span class=bv id=bet-display>10.00</span><button onclick=aB(10)>+</button></div>
<div class=qb><button class=qbe onclick=sB(5)>5</button><button class=qbe onclick=sB(25)>25</button><button class=qbe onclick=sB(100)>100</button><button class=qbe onclick=sB(500)>500</button></div>
<button class=ab dp id=drop-btn onclick=dB()>DROP BALL</button></div></div>
<script type=module>const S={b:10000,bet:10,dr:false,h:[],rows:12};const cv=document.getElementById('pcanvas'),ctx=cv.getContext('2d');function rs(){cv.width=cv.parentElement.clientWidth;cv.height=Math.min(cv.parentElement.clientHeight-40,500)}rs();window.addEventListener('resize',rs);
const mults=[.1,.2,.3,.5,1,3,5,10,.5,.3,.2,.1];const bke=document.getElementById('bkt-el');mults.forEach((m,i)=>{const d=document.createElement('div');d.className='bk';d.textContent=m+'x';bke.appendChild(d)});
function draw(){ctx.clearRect(0,0,cv.width,cv.height);const pH=cv.height/(S.rows+2);for(let r=0;r<S.rows;r++){for(let c=0;c<=r;c++){const x=cv.width/2+(c-r/2)*(pH*1.2),y=pH+r*pH;ctx.beginPath();ctx.arc(x,y,3.5,0,6.28);ctx.fillStyle='rgba(255,255,255,.15)';ctx.fill()}}}
function dB(){if(S.dr||S.bet>S.b)return;S.dr=true;const btn=document.getElementById('drop-btn');btn.textContent='...';btn.style.pointerEvents='none';let col=S.rows/2;let step=0;const iv=setInterval(function(){step++;if(step>=15){clearInterval(iv);fD(col)}},80)}
function fD(fc){const idx=Math.max(0,Math.min(mults.length-1,fc));const m=mults[idx];const w=S.bet*m;if(m>=1)S.b+=w-S.bet;else S.b-=S.bet;S.h.unshift({m:m,w:w});if(S.h.length>20)S.h.pop();document.getElementById('balance-display').textContent=S.b.toFixed(2);let h='';for(let i=0;i<S.h.length;i++){const cl=S.h[i].m>=3?'hg':S.h[i].m>=1?'mi':'lo';h+='<div class="hit '+cl+'">'+S.h[i].m+'x</div>'}document.getElementById('history-bar').innerHTML=h;S.dr=false;const btn=document.getElementById('drop-btn');btn.textContent='DROP BALL';btn.style.pointerEvents='auto'}
window.aB=function(d){if(S.dr)return;S.bet=Math.max(1,Math.min(S.b,S.bet+d));document.getElementById('bet-display').textContent=S.bet.toFixed(2)};window.sB=function(a){if(S.dr)return;S.bet=Math.max(1,a);document.getElementById('bet-display').textContent=S.bet.toFixed(2)};draw();</script>
<script type=module>import{setupBotOverlay}from'../_engine/core/bot-overlay.js';try{setupBotOverlay('#game-wrap',{gameName:'plinko-master',refreshInterval:3000})}catch(e){console.warn('[BotOverlay]',e.message)}</script><script type="module">import{initVFX}from'../_engine/core/vfx.js';import{playSound}from'../_engine/core/audio.js';document.querySelectorAll('#game-wrap button').forEach(function(b){b.addEventListener('click',function(){try{playSound('click')}catch(e){}})});try{initVFX({container:document.getElementById('game-wrap'),intensity:'medium'})}catch(e){console.warn('[VFX]',e.message)}</script></body></html>
